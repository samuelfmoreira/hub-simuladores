<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454b54"/><stop offset="1" stop-color="#262a30"/></linearGradient>
    <linearGradient id="faixa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d23b2e"/><stop offset="1" stop-color="#a51f17"/></linearGradient>
    <linearGradient id="chama" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e5261b"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffc23d"/></linearGradient>
    <linearGradient id="chama2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb02e"/><stop offset="1" stop-color="#fff2a8"/></linearGradient>
    <linearGradient id="tubo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f05a4a"/><stop offset=".5" stop-color="#d0281c"/><stop offset="1" stop-color="#9b1a12"/></linearGradient>
    <linearGradient id="tuboV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f05a4a"/><stop offset=".5" stop-color="#d0281c"/><stop offset="1" stop-color="#9b1a12"/></linearGradient>
    <linearGradient id="motor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82d6"/><stop offset=".5" stop-color="#1f5fae"/><stop offset="1" stop-color="#143f78"/></linearGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d7dade"/><stop offset=".5" stop-color="#eef0f2"/><stop offset="1" stop-color="#c3c7ce"/></linearGradient>
    <radialGradient id="led"><stop offset="0" stop-color="#d8ffe3"/><stop offset=".5" stop-color="#3fe06a"/><stop offset="1" stop-color="#1c9a43"/></radialGradient>
    <clipPath id="canto"><rect width="512" height="512" rx="76"/></clipPath>
  </defs>
  <g clip-path="url(#canto)">
    <rect width="512" height="512" fill="url(#fundo)"/>
