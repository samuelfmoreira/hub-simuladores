    <path d="M405 404 C405 420 336 420 300 350" fill="none" stroke="#1d2024" stroke-width="9" stroke-linecap="round"/>
    <path d="M405 404 C405 420 336 420 300 350" fill="none" stroke="#3a3f46" stroke-width="4" stroke-linecap="round"/>

    <!-- ===== SSW-05 Plus ===== -->
    <rect x="342" y="98" width="126" height="310" rx="8" fill="#17478a"/>
    <rect x="336" y="104" width="138" height="300" rx="9" fill="url(#corpo)" stroke="#a7acb5" stroke-width="2"/>
    <text x="405" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#2b2f33">SSW-05</text>
    <!-- bornes de entrada -->
    <g fill="#2b2f33"><circle cx="360" cy="146" r="13"/><circle cx="405" cy="146" r="13"/><circle cx="450" cy="146" r="13"/></g>
    <g fill="#6b7078"><circle cx="360" cy="146" r="6"/><circle cx="405" cy="146" r="6"/><circle cx="450" cy="146" r="6"/></g>
    <!-- aletas -->
    <g fill="#9aa0aa"><path d="M350 166 h10 l-7 20 h-10 z"/><path d="M366 166 h10 l-7 20 h-10 z"/><path d="M382 166 h10 l-7 20 h-10 z"/></g>
    <g fill="#b9bec6"><rect x="404" y="174" width="14" height="6"/><rect x="422" y="174" width="14" height="6"/><rect x="440" y="174" width="14" height="6"/></g>
