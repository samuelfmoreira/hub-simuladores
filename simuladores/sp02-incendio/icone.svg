    <line x1="144" y1="157" x2="144" y2="191"/><line x1="154" y1="157" x2="154" y2="191"/><line x1="164" y1="157" x2="164" y2="191"/><line x1="174" y1="157" x2="174" y2="191"/>
  </g>
  <rect x="138" y="143" width="20" height="10" rx="2" fill="#1B4C8E"/>
  <rect x="112" y="194" width="10" height="4" fill="#5E676B"/><rect x="172" y="194" width="10" height="4" fill="#5E676B"/>

