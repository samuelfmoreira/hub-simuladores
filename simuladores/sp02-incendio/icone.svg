    <text x="256" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="35" letter-spacing="1" fill="#ffffff">SISTEMA DE INCÊNDIO</text>
    <rect x="40" y="84" width="432" height="3" rx="1.5" fill="#d23b2e" opacity=".9"/>

    <!-- ===== sistema de incêndio ===== -->
    <!-- chama -->
    <path d="M78 214 C38 196 34 150 62 120 C62 142 74 150 82 150 C74 124 86 100 110 92 C102 118 120 132 128 150 C134 140 132 128 128 120 C152 140 158 182 132 204 C122 212 100 218 78 214 Z" fill="url(#chama)"/>
    <path d="M90 210 C72 200 72 178 84 166 C86 178 94 182 98 182 C96 168 102 156 114 150 C112 166 124 176 124 190 C124 204 108 214 90 210 Z" fill="url(#chama2)"/>
    <!-- tubulação: subida da bomba e barrilete -->
    <rect x="131" y="214" width="20" height="104" fill="url(#tuboV)"/>
    <rect x="131" y="202" width="176" height="20" rx="4" fill="url(#tubo)"/>
    <circle cx="141" cy="212" r="13" fill="#c42a1e"/>
    <!-- manômetro -->
    <rect x="214" y="176" width="6" height="28" fill="#8a9099"/>
    <circle cx="217" cy="160" r="27" fill="#f4f4f1" stroke="#8a9099" stroke-width="5"/>
    <path d="M198 168 A21 21 0 0 1 236 168" fill="none" stroke="#d23b2e" stroke-width="4"/>
    <line x1="217" y1="160" x2="231" y2="148" stroke="#262a30" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="217" cy="160" r="3.5" fill="#262a30"/>
    <!-- registro (volante) -->
    <rect x="276" y="196" width="18" height="32" rx="3" fill="#b8231a"/>
    <rect x="283" y="178" width="4" height="20" fill="#8a9099"/>
    <ellipse cx="285" cy="176" rx="20" ry="6" fill="none" stroke="#c7ccd3" stroke-width="5"/>
    <!-- base, bomba e motor -->
    <rect x="96" y="374" width="214" height="12" rx="3" fill="#7d838c"/>
    <circle cx="141" cy="340" r="32" fill="url(#tubo)"/>
    <circle cx="141" cy="340" r="12" fill="#9b1a12"/>
    <rect x="128" y="300" width="26" height="12" fill="#b8231a"/>
    <rect x="172" y="333" width="16" height="14" fill="#7d838c"/>
    <rect x="186" y="312" width="114" height="58" rx="10" fill="url(#motor)"/>
    <g stroke="#0f325f" stroke-width="2.5" opacity=".7">
      <line x1="200" y1="318" x2="200" y2="364"/><line x1="214" y1="318" x2="214" y2="364"/><line x1="228" y1="318" x2="228" y2="364"/>
      <line x1="242" y1="318" x2="242" y2="364"/><line x1="256" y1="318" x2="256" y2="364"/><line x1="270" y1="318" x2="270" y2="364"/>
    </g>
    <rect x="232" y="302" width="26" height="12" rx="2" fill="#174a8c"/>
    <rect x="196" y="368" width="12" height="8" fill="#5f656e"/><rect x="276" y="368" width="12" height="8" fill="#5f656e"/>

