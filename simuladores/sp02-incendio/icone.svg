<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Sistema de incêndio com soft-starter SSW-05">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EE5A4B"/><stop offset=".5" stop-color="#D2382C"/><stop offset="1" stop-color="#A3241B"/></linearGradient>
    <linearGradient id="tbv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EE5A4B"/><stop offset=".5" stop-color="#D2382C"/><stop offset="1" stop-color="#A3241B"/></linearGradient>
    <radialGradient id="vol" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#F06A5B"/><stop offset=".6" stop-color="#D2382C"/><stop offset="1" stop-color="#9C2219"/></radialGradient>
    <linearGradient id="mot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A8BD8"/><stop offset=".45" stop-color="#2463B3"/><stop offset="1" stop-color="#173F78"/></linearGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCDFE2"/><stop offset=".5" stop-color="#F3F4F5"/><stop offset="1" stop-color="#C9CDD3"/></linearGradient>
    <linearGradient id="ch" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E5261B"/><stop offset=".55" stop-color="#FF7A1A"/><stop offset="1" stop-color="#FFC23D"/></linearGradient>
    <linearGradient id="ch2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFB02E"/><stop offset="1" stop-color="#FFF2A8"/></linearGradient>
    <radialGradient id="led"><stop offset="0" stop-color="#E4FFEA"/><stop offset=".5" stop-color="#3FE06A"/><stop offset="1" stop-color="#1C9A43"/></radialGradient>
