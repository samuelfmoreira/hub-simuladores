  <g fill="#A7ACB5"><rect x="275" y="91" width="12" height="2"/><rect x="275" y="99" width="12" height="2"/><rect x="275" y="107" width="12" height="2"/><rect x="275" y="115" width="12" height="2"/><rect x="275" y="123" width="12" height="2"/></g>
