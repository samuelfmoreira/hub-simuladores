    <line x1="247.5" y1="136.5" x2="254.5" y2="143.5"/><line x1="254.5" y1="136.5" x2="247.5" y2="143.5"/>
    <line x1="232.5" y1="164.5" x2="239.5" y2="171.5"/><line x1="239.5" y1="164.5" x2="232.5" y2="171.5"/>
    <line x1="247.5" y1="164.5" x2="254.5" y2="171.5"/><line x1="254.5" y1="164.5" x2="247.5" y2="171.5"/>
