  <g fill="#FBFBF9" stroke="#55595F" stroke-width="1.4"><circle cx="236" cy="140" r="6.5"/><circle cx="251" cy="140" r="6.5"/><circle cx="236" cy="168" r="6.5"/><circle cx="251" cy="168" r="6.5"/></g>
  <g stroke="#55595F" stroke-width="1.6" stroke-linecap="round">
