  <path d="M40 102 C31 97 31 86 37 80 C38 86 42 88 44 88 C43 81 46 75 52 72 C51 80 57 85 57 92 C57 99 49 104 40 102 Z" fill="url(#ch2)"/>

  <!-- tubulação: subida da bomba e barrilete -->
  <rect x="64" y="84" width="13" height="74" fill="url(#tbv)"/>
  <rect x="64" y="76" width="134" height="13" rx="3" fill="url(#tb)"/>
  <circle cx="70.5" cy="82.5" r="9" fill="#C42F23"/>
  <rect x="62" y="104" width="17" height="5" rx="1.5" fill="#A3241B"/>
