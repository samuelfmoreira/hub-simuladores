    <rect x="344" y="194" width="66" height="160" rx="3" fill="#cfd3d9" stroke="#a7acb5" stroke-width="1.5"/>
    <g fill="#f8f8f6" stroke="#55595f" stroke-width="2">
      <circle cx="362" cy="268" r="11"/><circle cx="392" cy="268" r="11"/><circle cx="362" cy="324" r="11"/><circle cx="392" cy="324" r="11"/>
    </g>
    <g stroke="#55595f" stroke-width="2.5" stroke-linecap="round">
      <line x1="356" y1="262" x2="368" y2="274"/><line x1="368" y1="262" x2="356" y2="274"/>
      <line x1="386" y1="262" x2="398" y2="274"/><line x1="398" y1="262" x2="386" y2="274"/>
      <line x1="356" y1="318" x2="368" y2="330"/><line x1="368" y1="318" x2="356" y2="330"/>
      <line x1="386" y1="318" x2="398" y2="330"/><line x1="398" y1="318" x2="386" y2="330"/>
    </g>
    <rect x="364" y="204" width="24" height="42" rx="2" fill="#f6f6f3" stroke="#888" stroke-width="1"/>
    <g fill="#2b2f33"><rect x="378" y="207" width="7" height="5"/><rect x="378" y="214" width="7" height="5"/><rect x="378" y="221" width="7" height="5"/><rect x="378" y="228" width="7" height="5"/><rect x="378" y="235" width="7" height="5"/><rect x="367" y="241" width="7" height="3"/></g>
    <!-- LEDs de proteção e de estado -->
    <g fill="#3a3d42"><rect x="420" y="204" width="12" height="7" rx="1"/><rect x="420" y="217" width="12" height="7" rx="1"/><rect x="420" y="230" width="12" height="7" rx="1"/><rect x="420" y="243" width="12" height="7" rx="1"/><rect x="420" y="256" width="12" height="7" rx="1"/></g>
    <g fill="#9aa0aa"><rect x="437" y="206" width="26" height="3"/><rect x="437" y="219" width="26" height="3"/><rect x="437" y="232" width="26" height="3"/><rect x="437" y="245" width="26" height="3"/><rect x="437" y="258" width="26" height="3"/></g>
    <circle cx="430" cy="290" r="10" fill="#3fe06a" opacity=".35"/>
    <circle cx="430" cy="290" r="6.5" fill="url(#led)"/>
    <rect x="442" y="288" width="22" height="4" fill="#9aa0aa"/>
    <rect x="420" y="312" width="44" height="34" rx="4" fill="#e6e8eb" stroke="#a7acb5" stroke-width="1.5"/>
    <!-- bornes de saída (U/V/W) -->
    <g fill="#2b2f33"><circle cx="360" cy="380" r="13"/><circle cx="405" cy="380" r="13"/><circle cx="450" cy="380" r="13"/></g>
    <g fill="#6b7078"><circle cx="360" cy="380" r="6"/><circle cx="405" cy="380" r="6"/><circle cx="450" cy="380" r="6"/></g>

    <!-- faixa: + SOFT SSW-05 -->
    <rect x="0" y="428" width="512" height="84" fill="url(#faixa)"/>
    <text x="256" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="44" letter-spacing="1" fill="#ffffff">+ SOFT SSW-05</text>
  </g>
</svg>
