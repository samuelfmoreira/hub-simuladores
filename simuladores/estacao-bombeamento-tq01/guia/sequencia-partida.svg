<text x="320" y="306" font-size="11" font-weight="600" text-anchor="start" fill="#1b5e9e">Partida: S0_Emerg_NF AND S2_Desliga_NF AND Inv_OK AND NOT LSHH AND NOT falha. O 2º NF do S0 também corta a DI1 por hardware.</text>
