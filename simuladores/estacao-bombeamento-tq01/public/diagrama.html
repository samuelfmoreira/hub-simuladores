<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

try { var u = new URL(location.href); if (u.searchParams.has('hubRestaurar')) { localStorage.clear(); sessionStorage.clear(); u.searchParams.delete('hubRestaurar'); history.replaceState(null, '', u.pathname + u.search + u.hash); } } catch (e) { /* sem armazenamento */ }</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagrama de ligação · Estação de bombeamento</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .diag-wrap { padding: 16px 20px 40px; }
    .diag-svg { width: 100%; max-width: 1400px; background: #fbfbf8; border: 1px solid var(--line); border-radius: 3px; display: block; margin: 0 auto; }
    .dl { fill: none; stroke: #1b2125; stroke-width: 1.4; }
    .dl.on { stroke: #2b8a45; stroke-width: 2.2; }
    .dl.sig { stroke: #1b5e9e; }
    .term { fill: #fff; stroke: #1b2125; stroke-width: 1.2; }
    .term.on { fill: #46e36d; }
    .lbl { font-size: 11px; fill: #1b2125; } .lbl.b { font-weight: 600; } .lbl.m { fill: #5d666c; font-size: 10px; } .lbl.v { font-family: var(--mono); font-size: 10.5px; fill: #1b5e9e; }
    .blk { fill: #e9ebe5; stroke: #3c444a; stroke-width: 1.6; }
    .legend { display: flex; gap: 18px; font-size: 13px; color: var(--muted); margin: 10px auto 0; max-width: 1400px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path fill="#2272b8" d="M6 4h20v4H6zM8 8h16v16a8 8 0 0 1-16 0z"/><path fill="#8fd3ff" d="M9 15c3-1 4 1 7 0s4 1 7 0v9a7 7 0 0 1-14 0z"/></svg>
      <div><h1>Diagrama de ligação <span class="brand-sub">ao vivo</span></h1><p class="brand-line">Fiação do XP325, do CFW500 e dos instrumentos, com o estado real de cada ponto</p></div>
    </div>
    <nav class="sessions"><a href="index.html" class="btn ghost">Voltar ao simulador</a></nav>
  </header>
  <div class="diag-wrap">
    <svg id="diag" class="diag-svg" viewBox="0 0 1400 900" role="img" aria-label="Diagrama de ligação"></svg>
    <div class="legend"><span>linha verde grossa = 24 V presente / contato fechado</span><span>borne verde = nível lógico 1 no CLP</span><span>azul = sinal analógico com valor ao vivo</span></div>
  </div>
  <script type="module" src="js/diagrama.js"></script>
</body>
</html>
