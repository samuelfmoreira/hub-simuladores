<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect width="1100" height="470" fill="#fbfbf8"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d666c"/></marker></defs>
<text x="550" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#1b2125">O caminho de um sinal analógico — entrada (nível) e saída (velocidade da bomba)</text>
<rect x="20" y="60" width="150" height="90" rx="8" fill="#e9ebe5" stroke="#3c444a" stroke-width="1.6"/><text x="95.0" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Processo</text><text x="95.0" y="100" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">nível real da água</text><text x="95.0" y="115" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">h = 1,52 m</text>
<rect x="205" y="60" width="150" height="90" rx="8" fill="#e9ebe5" stroke="#3c444a" stroke-width="1.6"/><text x="280.0" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Transmissor LT-01</text><text x="280.0" y="100" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">faixa 0–3,5 m</text><text x="280.0" y="115" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">gera 4–20 mA</text><text x="280.0" y="130" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">1,52 m → 10,95 mA</text>
<rect x="390" y="60" width="150" height="90" rx="8" fill="#eef3f9" stroke="#3c444a" stroke-width="1.6"/><text x="465.0" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Canal EA0 (A/D)</text><text x="465.0" y="100" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">modo 4–20 mA</text><text x="465.0" y="115" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">(mA − 4)/16 × 32767</text><text x="465.0" y="130" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">10,95 mA → 14230</text>
<rect x="575" y="60" width="150" height="90" rx="8" fill="#eef3f9" stroke="#3c444a" stroke-width="1.6"/><text x="650.0" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Rede</text><text x="650.0" y="100" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">Modbus holding 0</text><text x="650.0" y="115" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">= 14230</text><text x="650.0" y="130" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">%IW0 no CODESYS</text>
<rect x="760" y="60" width="150" height="90" rx="8" fill="#eef3f9" stroke="#3c444a" stroke-width="1.6"/><text x="835.0" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">GVL_SIM</text><text x="835.0" y="100" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">LT01_Bruto = 14230</text><text x="835.0" y="115" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">(AT %IW0)</text>
<rect x="945" y="60" width="150" height="90" rx="8" fill="#e9ebe5" stroke="#3c444a" stroke-width="1.6"/><text x="1020.0" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Seu programa</text><text x="1020.0" y="100" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">escalona: 14230/32767</text><text x="1020.0" y="115" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">× 3,5 = 1,52 m</text><text x="1020.0" y="130" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">alarma, controla</text>
<text x="20" y="172" font-size="11" font-weight="600" text-anchor="start" fill="#1b5e9e">ENTRADA: o simulador faz o papel do transmissor e do A/D; o CLP recebe só a contagem, como no hardware.</text>
<rect x="945" y="220" width="150" height="90" rx="8" fill="#e9ebe5" stroke="#3c444a" stroke-width="1.6"/><text x="1020.0" y="240" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Seu programa</text><text x="1020.0" y="260" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">decide 75 %</text><text x="1020.0" y="275" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">escalona: 75/100 × 32767</text><text x="1020.0" y="290" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">Ref_Bruto := 24575</text>
<rect x="760" y="220" width="150" height="90" rx="8" fill="#eef3f9" stroke="#3c444a" stroke-width="1.6"/><text x="835.0" y="240" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">GVL_SIM</text><text x="835.0" y="260" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">Ref_Bruto = 24575</text><text x="835.0" y="275" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">(AT %QW0)</text>
<rect x="575" y="220" width="150" height="90" rx="8" fill="#eef3f9" stroke="#3c444a" stroke-width="1.6"/><text x="650.0" y="240" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Rede</text><text x="650.0" y="260" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">Modbus input 0</text><text x="650.0" y="275" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">= 24575</text><text x="650.0" y="290" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">lido a cada 100 ms</text>
<rect x="390" y="220" width="150" height="90" rx="8" fill="#eef3f9" stroke="#3c444a" stroke-width="1.6"/><text x="465.0" y="240" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Canal SA0 (D/A)</text><text x="465.0" y="260" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">modo 0–10 V</text><text x="465.0" y="275" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">24575/32767 × 10 V</text><text x="465.0" y="290" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">= 7,50 V</text>
<rect x="205" y="220" width="150" height="90" rx="8" fill="#e9ebe5" stroke="#3c444a" stroke-width="1.6"/><text x="280.0" y="240" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">CFW500 — AI1</text><text x="280.0" y="260" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">P0233 = 0 (0–10 V)</text><text x="280.0" y="275" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">10 V = P0134 = 60 Hz</text><text x="280.0" y="290" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">7,5 V → 45 Hz</text>
<rect x="20" y="220" width="150" height="90" rx="8" fill="#e9ebe5" stroke="#3c444a" stroke-width="1.6"/><text x="95.0" y="240" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Processo</text><text x="95.0" y="260" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">motor 1314 rpm</text><text x="95.0" y="275" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">bomba enche 12 m³/h</text><text x="95.0" y="290" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">o nível sobe</text>
<text x="20" y="332" font-size="11" font-weight="600" text-anchor="start" fill="#1b5e9e">SAÍDA: o mesmo caminho ao contrário. O inversor só obedece em REM e com o disjuntor Q1 ligado; Inv_Gira liga a DI1.</text>
<path d="M95 310 V365 H1020 V150" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="560" y="358" font-size="10.5" font-weight="600" text-anchor="middle" fill="#c0392b">malha fechada: a velocidade da bomba muda o nível, o LT-01 mede, o programa reage</text>
<rect x="20" y="385" width="1060" height="70" rx="8" fill="#fff7e6" stroke="#3c444a" stroke-width="1.6"/><text x="550.0" y="405" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2125">Como no hardware: o CLP só vê contagens de 15 bits</text><text x="550.0" y="425" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">Entrada: LT01_Bruto = 0–32767 para 4–20 mA (negativo abaixo de 4 mA). Saída: Ref_Bruto = 0–32767 para 0–10 V.</text><text x="550.0" y="440" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d666c">O escalonamento para metros e para % é feito no seu programa (exercício 2); o modo do canal errado dá número errado, como no hardware.</text>
<path d="M170 105 L225 105" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M355 105 L410 105" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M540 105 L595 105" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M725 105 L780 105" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M910 105 L965 105" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M945 265 L890 265" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M760 265 L705 265" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M575 265 L520 265" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M390 265 L335 265" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M205 265 L150 265" fill="none" stroke="#5d666c" stroke-width="1.8" marker-end="url(#a)"/>
</svg>